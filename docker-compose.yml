services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  demo-target:
    build:
      context: ./demo_target
    ports:
      - "127.0.0.1:${DEMO_TARGET_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "app.database.migrations", "upgrade"]
    environment: &backend-environment
      AUTH_MODE: ${AUTH_MODE:-local}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-sentinel}
      DATABASE_USER: ${POSTGRES_USER:-sentinel}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TARGET_REQUEST_TIMEOUT_SECONDS: ${TARGET_REQUEST_TIMEOUT_SECONDS:-10}
      JUDGE_ENABLED: ${JUDGE_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      JUDGE_TIMEOUT_SECONDS: ${JUDGE_TIMEOUT_SECONDS:-20}
      JUDGE_CACHE_PATH: /tmp/sentinel-judge-cache.sqlite3
      JUDGE_PRICE_VERSION: ${JUDGE_PRICE_VERSION:-unconfigured}
      JUDGE_INPUT_USD_PER_MILLION: ${JUDGE_INPUT_USD_PER_MILLION:-}
      JUDGE_OUTPUT_USD_PER_MILLION: ${JUDGE_OUTPUT_USD_PER_MILLION:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=8)
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
