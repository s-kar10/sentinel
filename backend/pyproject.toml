[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-backend"
version = "0.1.0"
description = "Security and reliability evaluation API for AI applications"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "SQLAlchemy==2.0.40",
  "alembic==1.20.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "cryptography==50.0.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires SENTINEL_TEST_POSTGRES_URL pointing to a disposable test database"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
